name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The commands are the ones in the Makefile, not weaker spellings of them.
    # `go test ./...` and `go vet ./...` alone compile no tagged file, so every
    # docker, mockserver, privileged, soak, mobileapi and ios source in the tree
    # was outside what CI checked; `make lint` is the only thing that builds
    # their union, and golangci-lint — which is what enforces a doc comment on
    # every exported identifier — ran nowhere at all.
    env:
      GOLANGCI_LINT_VERSION: v2.13.2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...
        env:
          CGO_ENABLED: "0"

      - name: Install golangci-lint
        run: |
          curl -sSfL \
            "https://raw.githubusercontent.com/golangci/golangci-lint/$GOLANGCI_LINT_VERSION/install.sh" |
            sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # No Docker and no root: the AWS Client VPN CRV1 regression gate and the
      # fastest end-to-end feedback in the tree.
      - name: Mock-server pass
        run: make test-mock

  cli-integration:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        redirect_gateway: ["", "1"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          mkdir -p bin
          go build -o bin/mock-server ./testenv/mockserver
          CGO_ENABLED=0 go build -o bin/openlawsvpn-cli ./cmd/cli

      - name: Run CLI integration test
        run: bash scripts/cli-integration.sh
        env:
          CLI_BIN: bin/openlawsvpn-cli
          MOCK_BIN: bin/mock-server
          SUDO: sudo
          MOCK_REDIRECT_GATEWAY: ${{ matrix.redirect_gateway }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-integration-logs-${{ matrix.os }}-rg${{ matrix.redirect_gateway }}
          path: tmp/openlawsvpn-cli.*.log
          if-no-files-found: ignore
